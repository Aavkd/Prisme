# Private 0600 file on the worker. Use a restricted dump role on the source,
# and a separate non-superuser CREATEDB role on a dedicated test cluster.
# Obtain real hostnames, ports, certificates and credentials from the operator.
[sounding-lines-source]
host=source.example.invalid
port=5432
dbname=sounding_lines
user=prisme_backup
sslmode=verify-full
sslrootcert=/etc/prisme/backup/source-ca.pem
passfile=/etc/prisme/backup/pgpass

[sounding-lines-test]
host=restore.example.invalid
port=5432
dbname=postgres
user=prisme_restore
sslmode=verify-full
sslrootcert=/etc/prisme/backup/test-ca.pem
passfile=/etc/prisme/backup/pgpass
