<div id="prisme-home-mobile" lang="fr" aria-label="Prisme · Accueil Android" data-device="android" data-density="comfortable">

</div>
<script>
(() => {
  const root = document.getElementById('prisme-home-mobile');
  const screen = root.querySelector('#p-screen');
  const modal = root.querySelector('#p-modal');
  const state = { device:'android', theme:'dark', density:'comfortable', scenario:'normal', accent:'cobalt' };
  const selection = {windows:{machines:['ovh','atelier'],workers:['codex','claude','audio']},android:{machines:['ovh'],workers:['claude','audio']}};
  let lastFocus = null;
  const machines = [
    {id:'ovh',name:'VPS OVH',icon:'server',role:'Production',system:'Ubuntu',cpu:28,ram:'3,4 / 7,6 Gio',ramPercent:45,disk:'40 / 72 Gio',diskPercent:56,network:'↓ 2,4 Mo/s',containers:'13 conteneurs',points:[23,22,24,23,25,22,27,28,26,32,34,29,31,25,23,26,31,29,27,28],gpu:'GPU non collecté'},
    {id:'atelier',name:'Atelier',icon:'monitor',role:'Développement',system:'Windows',cpu:42,ram:'18,2 / 32 Gio',ramPercent:57,disk:'480 / 960 Gio',diskPercent:50,network:'↓ 840 Ko/s',containers:'2 agents IA',points:[28,29,25,27,34,40,38,48,46,49,37,42,41,47,53,48,41,40,44,42],gpu:'GPU non collecté'},
    {id:'tour',name:'Tour Mantara',icon:'hard-drive',role:'Centre de contrôle',system:'Windows',cpu:16,ram:'12 / 64 Gio',ramPercent:19,disk:'320 / 2 000 Gio',diskPercent:16,network:'↓ 160 Ko/s',containers:'6 conteneurs',points:[10,12,11,9,15,12,14,13,15,16,13,15,14,18,17,14,15,16,15,16],gpu:'GPU non collecté'}
  ];
  const workers = [
    {id:'codex',name:'Codex',icon:'square-terminal',task:'Fiabiliser les tests du pipeline',project:'Arpent',machine:'Atelier',time:'12 min 34 s',status:'En cours',tone:'active',resources:'CPU 8 % · RAM 620 Mio',detail:'Dernière activité : exécution des tests d’intégration. Le connecteur ne fournit pas de progression chiffrée.'},
    {id:'claude',name:'Claude Code',icon:'asterisk',task:'Améliorer la navigation du catalogue',project:'Sounding Lines',machine:'Atelier',time:'En attente · 3 min',status:'À vous',tone:'warn',resources:'CPU 0 % · RAM 412 Mio',detail:'Quelle navigation souhaitez-vous pour le catalogue : pagination par pages ou chargement progressif ?'},
    {id:'audio',name:'Worker audio',icon:'audio-lines',task:'Analyser les nouvelles pistes',project:'Sounding Lines',machine:'VPS OVH',time:'2 min 18 s',status:'En cours',tone:'active',resources:'CPU 14 % · RAM 280 Mio',detail:'Traitement de la piste 2 sur 3. Progression publiée par le pipeline audio ; 4 tâches en file, plus ancienne depuis 36 secondes.'}
  ];
  const icons = (name) => '<i data-lucide="'+name+'" aria-hidden="true"></i>';
  const badge = (label,tone,icon) => '<span class="p-badge p-'+tone+'">'+(icon?icons(icon):'<span class="p-dot"></span>')+label+'</span>';
  const button = (label,action,icon,extra='') => '<button type="button" class="p-button '+extra+'" data-action="'+action+'" aria-label="'+label+'">'+(icon?icons(icon):'')+'<span>'+label+'</span></button>';
  const isOld = () => state.scenario==='offline';
  const freshness = () => isOld()?'Cache · 14:18':state.scenario==='partial'?'Collecte partielle':'Actualisé il y a 4 s';
  function refreshIcons(){if(globalThis.lucide) lucide.createIcons({attrs:{width:16,height:16}});}
  function spark(machine){const pts=machine.points.map((v,i)=>(i*200/19).toFixed(1)+','+(43-v*.62).toFixed(1)).join(' ');return '<svg class="p-spark" viewBox="0 0 200 45" preserveAspectRatio="none" role="img" aria-label="CPU sur les 15 dernières minutes, de '+Math.min(...machine.points)+' à '+Math.max(...machine.points)+' pour cent. Dernière valeur '+machine.cpu+' pour cent."><title>CPU (%) · 15 dernières minutes</title><line x1="0" x2="200" y1="12" y2="12"></line><line x1="0" x2="200" y1="35" y2="35"></line><polygon points="0,45 '+pts+' 200,45"></polygon><polyline points="'+pts+'"></polyline></svg>';}
  function machineCard(m){const partial=state.scenario==='partial'&&m.id==='atelier';return '<button type="button" class="p-machine" data-machine="'+m.id+'" aria-label="Voir '+m.name+'"><div class="p-card-top"><span class="p-resource-icon">'+icons(m.icon)+'</span><span class="p-card-title"><strong>'+m.name+'</strong><small>'+m.system+' · '+m.role+'</small></span>'+badge(isOld()?'Ancien':partial?'Partiel':'En ligne',isOld()?'muted':partial?'warn':'ok',isOld()?'clock':partial?'circle-alert':'check')+'</div><div class="p-machine-chart"><div class="p-cpu"><span class="p-mono">'+m.cpu+'<span class="p-unit">%</span></span><small>Processeur'+(isOld()?' · en cache':'')+'</small></div><div class="p-trend">'+spark(m)+'<div class="p-trend-labels"><span>−15 min</span><span>'+ (isOld()?'14:18':'14:32') +'</span></div></div></div><div class="p-machine-metrics"><div><div class="p-meter-title"><span>RAM</span><b>'+m.ram+'</b></div><div class="p-meter"><span style="width:'+m.ramPercent+'%"></span></div></div><div><div class="p-meter-title"><span>Disque</span><b>'+m.disk+'</b></div><div class="p-meter"><span style="width:'+m.diskPercent+'%"></span></div></div></div><div class="p-card-foot"><span>'+m.containers+' · '+m.network+'</span><span>'+ (isOld()?'Ancien · 14:18':partial?'GPU non collecté':'Agent · 4 s') +'</span></div></button>';}
  function workerCard(w){const incident=state.scenario==='incident'&&w.id==='audio';return '<article class="p-worker"><div class="p-worker-title"><span class="p-resource-icon">'+icons(w.icon)+'</span><strong>'+w.name+'</strong>'+badge(isOld()?'Ancien':incident?'Bloqué':w.status,isOld()?'muted':incident?'danger':w.tone,isOld()?'clock':incident?'circle-alert':w.id==='claude'?'message-circle':null)+'</div><button type="button" class="p-worker-task" data-worker="'+w.id+'">'+w.task+'</button><div class="p-worker-meta"><span>'+w.project+'</span><span>·</span><span>'+w.machine+'</span><span>·</span><span>'+(incident?'10 min 18 s':w.time)+'</span></div>'+ (w.id==='claude'?'<div class="p-request"><span>Une décision sur la pagination</span><button type="button" class="p-textbutton" data-worker="claude">Examiner '+icons('arrow-up-right')+'</button></div>':w.id==='audio'?'<div class="p-progress" role="progressbar" aria-label="Traitement des pistes'+(isOld()?' en cache':'')+'" aria-valuemin="0" aria-valuemax="3" aria-valuenow="2"><span style="width:66.7%"></span></div>':'')+'<div class="p-worker-bottom"><span>'+(w.id==='audio'?'2 / 3 pistes · 4 en file':w.id==='codex'?'Progression indisponible':w.resources)+'</span><span>'+(isOld()?'Cache · 14:18':incident?'Sans progrès · 8 min':'Observé · 4 s')+'</span></div></article>';}
  function navItem(icon,label,selected=false){return '<span class="p-navitem '+(selected?'p-selected':'')+'" '+(selected?'aria-current="page"':'aria-disabled="true"')+'>'+icons(icon)+label+'</span>';}
  function showModal(title,content){if(modal.hidden)lastFocus=document.activeElement;root.querySelector('#p-dialog-title').textContent=title;root.querySelector('#p-dialog-body').innerHTML=content;modal.hidden=false;screen.inert=true;refreshIcons();modal.querySelector('button').focus();}
  function closeModal(){modal.hidden=true;screen.inert=false;if(lastFocus&&lastFocus.isConnected)lastFocus.focus();}
  function render(){
    root.dataset.device=state.device;root.dataset.density=state.density;root.dataset.theme=state.theme;root.style.colorScheme=state.theme==='system'?'light dark':state.theme==='matrix'?'dark':state.theme;
    root.style.setProperty('--p-blue',state.theme==='matrix'?'#6dff96':state.accent==='teal'?'light-dark(#087880,#6ccdd5)':'light-dark(#2455c7,#8aaaff)');root.style.setProperty('--p-blue-bg',state.theme==='matrix'?'#10371e':state.accent==='teal'?'light-dark(#e0f3f4,#143034)':'light-dark(#e6edfc,#1b2945)');root.style.setProperty('--p-solid',state.theme==='matrix'?'#66f28d':state.accent==='teal'?'#087880':'#3768df');
    const selected=selection[state.device];const ms=state.scenario==='empty'?[]:machines.filter(m=>selected.machines.includes(m.id));const ws=state.scenario==='empty'?[]:workers.filter(w=>selected.workers.includes(w.id));const old=isOld();const incident=state.scenario==='incident';const partial=state.scenario==='partial';
    const statusText=old?'État actuel inconnu':incident?'Un incident demande votre attention':partial?'Production opérationnelle · collecte partielle':'Production opérationnelle';const statusTone=old?'muted':incident?'danger':partial?'warn':'ok';
    let banner='';
    if(incident)banner='<div class="p-banner p-danger">'+icons('circle-alert')+'<div class="p-banner-content"><div class="p-eyebrow p-danger">P1 · Sounding Lines · Production</div><strong>Le traitement audio n’avance plus</strong><p>4 pistes en attente. Aucun progrès depuis 8 min ; le service reste joignable. Redémarrage proposé, en attente de validation.</p>'+button('Voir l’incident','incident','arrow-up-right')+'</div></div>';
    if(old)banner='<div class="p-banner p-warn">'+icons('unplug')+'<div class="p-banner-content"><strong>Centre de contrôle injoignable</strong><p>Dernière connexion à 14:18. Les données en cache sont en lecture seule. L’état actuel du VPS n’est pas connu.</p>'+button('Accéder au VPS en secours','rescue','shield')+'</div></div>';
    if(partial)banner='<div class="p-banner p-warn">'+icons('circle-alert')+'<div class="p-banner-content"><strong>Collecte partielle sur Atelier</strong><p>CPU et mémoire disponibles. Les mesures GPU ne sont pas collectées.</p></div></div>';
    screen.innerHTML='<div class="p-titlebar"><span>'+icons(state.device==='android'?'smartphone':'app-window')+'Prisme <span class="p-muted">/ Mantara</span></span><span class="p-study">Étude 01 · Données fictives</span></div><div class="p-shell"><aside class="p-sidebar" aria-label="Navigation principale"><div class="p-brand"><span class="p-logo">'+icons('triangle')+'</span>prisme</div><div class="p-workspace"><span class="p-avatar">M</span><span>Mantara<br><small class="p-muted" style="font-size:11px">Espace personnel</small></span></div><nav class="p-nav">'+navItem('layout-dashboard','Vue d’ensemble',true)+navItem('circle-alert','Incidents')+'<div class="p-nav-label">Infrastructure</div>'+navItem('layers-2','Projets')+navItem('server','Machines')+navItem('bot','Workers')+navItem('chart-no-axes-combined','Observabilité')+'<div class="p-nav-label">Opérations</div>'+navItem('git-pull-request','Déploiements')+navItem('workflow','Automatisations')+navItem('archive','Sauvegardes')+navItem('globe-2','Réseau')+navItem('square-terminal','Terminaux')+'</nav><div class="p-side-bottom"><div class="p-connection p-'+(old?'warn':'ok')+'"><span class="p-dot"></span>'+ (old?'Centre injoignable':'Centre connecté')+'</div><div class="p-device">'+icons('monitor')+'<span>Atelier · Windows<br><small style="font-size:11px">Sélection de cet appareil</small></span></div></div></aside><main class="p-main"><header class="p-topbar"><div class="p-topbar-left">Espace personnel <span style="color:var(--p-line)">/</span><span style="color:var(--p-text)">Vue d’ensemble</span></div><div class="p-brand p-mobile-brand"><span class="p-logo">'+icons('triangle')+'</span>prisme</div><div class="p-tools"><span class="p-env">'+icons('shield-check')+'Production</span><button type="button" class="p-search" data-action="search" aria-label="Rechercher une ressource">'+icons('search')+'<span>Rechercher</span><kbd>Ctrl K</kbd></button><span class="p-avatar" aria-label="Mantara">M</span></div></header><div class="p-content"><div class="p-heading"><div><div class="p-eyebrow">Votre infrastructure, en un regard</div><h1>Vue d’ensemble</h1><p>Samedi 5 septembre <span style="margin:0 5px">·</span>'+freshness()+'</p></div>'+button('Personnaliser','customize','sliders-horizontal')+'</div>'+banner+'<section class="p-health" aria-label="État de toute l’infrastructure supervisée"><div class="p-health-head"><span class="p-'+statusTone+'">'+icons(old?'clock':incident?'circle-alert':'circle-check')+'</span><strong>'+statusText+'</strong><small>'+ (old?'Dernier état connu · 14:18':incident?'1 P1 · 0 P0':'Dernier contrôle réussi · 14:32') +'</small></div><div class="p-health-stats"><div class="p-stat"><span class="p-stat-label">Services sains</span><span class="p-stat-value">'+(old?'—':incident?'12':'13')+' <small>/ 13</small></span></div><div class="p-stat"><span class="p-stat-label">Machines en ligne</span><span class="p-stat-value">'+(old?'—':'3')+' <small>/ 3</small></span></div><div class="p-stat"><span class="p-stat-label">Travaux en cours</span><span class="p-stat-value">'+(old?'—':incident?'2':'3')+'</span><span class="p-stat-tail">'+(incident?'1 worker · 1 build':'2 workers · 1 build')+'</span></div><div class="p-stat"><span class="p-stat-label">'+(old?'Validations en cache':'À examiner')+'</span><span class="p-stat-value '+(old?'p-muted':'p-warn')+'">'+(incident?'2':'1')+'</span><span class="p-stat-tail">'+(incident?'dont 1 incident':'décision')+'</span></div></div></section><div class="p-columns"><section><div class="p-section-head"><div><h2>Mes machines</h2><span class="p-section-sub">'+ms.length+' épinglée'+(ms.length!==1?'s':'')+' · 3 supervisées</span></div><button type="button" class="p-textbutton" data-action="machines">Toutes '+icons('arrow-up-right')+'</button></div><div class="p-machine-list">'+(ms.length?ms.map(machineCard).join(''):'<div class="p-empty">'+icons('server')+'<h3>Votre sélection commence ici</h3><p>Épinglez les machines à suivre sur cet appareil.</p>'+button('Choisir mes machines','customize','plus')+'</div>')+'</div></section><section><div class="p-section-head"><div><h2>Mes workers</h2><span class="p-section-sub">'+ws.length+' épinglé'+(ws.length!==1?'s':'')+' · '+(old?'Dernier état connu':ws.some(w=>w.id==='claude')?'1 demande votre attention':'Aucune demande en attente')+'</span></div><button type="button" class="p-textbutton" data-action="workers">Tous '+icons('arrow-up-right')+'</button></div>'+(ws.length?'<div class="p-workers">'+ws.map(workerCard).join('')+'</div>':'<div class="p-empty">'+icons('bot')+'<h3>Gardez vos workers en vue</h3><p>Choisissez les agents et services à afficher.</p>'+button('Choisir mes workers','customize','plus')+'</div>')+'</section></div><div class="p-columns"><section><div class="p-section-head"><div><h2>Projets suivis</h2><span class="p-section-sub">Environnement de production</span></div></div><div class="p-projects">'+projectRow('SL','Sounding Lines','v0.8.4','Il y a 24 min',old?'Ancien':incident?'Dégradé':'4 / 4 sains',old?'muted':incident?'danger':'ok','sounding')+projectRow('Ar','Arpent','v1.2.1','Il y a 2 h',old?'Ancien':'4 / 4 sains',old?'muted':'ok','arpent')+'</div></section><section><div class="p-section-head"><div><h2>Activité récente</h2><span class="p-section-sub">'+(old?'Historique en cache · jusqu’à 14:18':'Livraisons et événements corrélés')+'</span></div></div><div class="p-timeline">'+(old?event('circle-check','Sounding Lines déployé','Production · v0.8.4 · par vous','14:08','ok')+event('archive','Sauvegarde Arpent vérifiée','Copie distante · intégrité validée','13:55','ok'):event('git-pull-request','Build Arpent en cours','main · Tests · GitHub Actions','14:29','active')+event('circle-check','Sounding Lines déployé','Production · v0.8.4 · par vous','14:08','ok')+event('archive','Sauvegarde Arpent vérifiée','Copie distante · intégrité validée','13:55','ok'))+'</div></section></div><div class="p-assurances"><span>'+icons('archive')+(old?'Sauvegardes · état ancien':'Sauvegardes vérifiées · 13:55')+'</span><span>'+icons('globe-2')+(old?'Edge · état inconnu':'Edge opérationnel · 14:32')+'</span><span>'+icons('shield')+'Autonomie désactivée</span></div></div><nav class="p-mobile-nav" aria-label="Navigation mobile"><span class="p-selected" aria-current="page">'+icons('layout-dashboard')+'Accueil</span><span aria-disabled="true">'+icons('circle-alert')+'Incidents</span><span aria-disabled="true">'+icons('layers-2')+'Projets</span><span aria-disabled="true">'+icons('server')+'Machines</span><span aria-disabled="true">'+icons('ellipsis')+'Plus</span></nav></main></div><footer class="p-statusbar"><span><span class="p-dot p-'+(old?'warn':'ok')+'"></span>'+ (old?'Centre de contrôle injoignable · cache en lecture seule':'Connecté · Toutes les ressources supervisées')+'</span><span class="p-footer-right">'+(incident?'1 incident P1':old?'Fraîcheur inconnue':'0 incident')+' <span>·</span> Europe/Paris</span></footer>';
    refreshIcons();
  }
  function projectRow(initials,name,version,age,status,tone,id){return '<button type="button" class="p-project" data-project="'+id+'"><span class="p-project-monogram">'+initials+'</span><span class="p-project-body"><span class="p-project-name">'+name+'</span><span class="p-project-meta">'+version+' · '+age+'</span></span><span class="p-project-end">'+badge(status,tone,isOld()?'clock':tone==='danger'?'circle-alert':'check')+'<small class="p-mono p-muted" style="font-size:11px">'+(isOld()?'Cache · 14:18':id==='sounding'?'p95 · 142 ms':'p95 · 218 ms')+'</small></span></button>';}
  function event(icon,title,sub,time,tone){return '<div class="p-event"><span class="p-event-icon p-'+tone+'">'+icons(icon)+'</span><span class="p-event-content"><strong>'+title+'</strong><small>'+sub+'</small></span><time datetime="2026-09-05T'+time+':00+02:00">'+time+'</time></div>';}
  const detailItem=(label,value)=>'<div><small>'+label+'</small><strong>'+value+'</strong></div>';
  function openMachine(id){const m=machines.find(x=>x.id===id);showModal(m.name,'<p>'+m.system+' · '+m.role+'</p><div class="p-detail-grid">'+detailItem('Processeur',m.cpu+' %')+detailItem('Mémoire',m.ram)+detailItem('Disque',m.disk)+detailItem('Réseau',m.network)+detailItem('GPU',m.gpu)+detailItem('Fraîcheur',isOld()?'Cache · 14:18':'Observé à 14:32')+'</div><p>'+(isOld()?'Données anciennes. Une perte de connexion au centre ne prouve pas que cette machine est arrêtée.':'Les mesures concernent l’ensemble de la machine. Le détail des processus permettrait ensuite d’examiner leur attribution.')+'</p><p class="p-preview-note">Données de démonstration. Les mesures de la future tour sont illustratives.</p>');}
  function openWorker(id){const w=workers.find(x=>x.id===id);const blocked=state.scenario==='incident'&&id==='audio';showModal(w.name,badge(isOld()?'Ancien':blocked?'Bloqué':w.status,isOld()?'muted':blocked?'danger':w.tone,isOld()?'clock':w.id==='claude'?'message-circle':null)+'<h3>'+w.task+'</h3><p>'+(blocked?'Aucun progrès depuis 8 minutes. Le processus répond, mais le traitement reste bloqué à la piste 2 sur 3.':w.detail)+'</p><div class="p-detail-grid">'+detailItem('Projet',w.project)+detailItem('Machine',w.machine)+detailItem('Durée',blocked?'10 min 18 s':w.time)+detailItem('Ressources locales',w.resources)+detailItem('Progression',w.id==='audio'?'2 / 3 pistes':'Indisponible')+detailItem('GPU du worker','Non attribuable')+detailItem('Coût / quotas','Non exposés')+detailItem('Fraîcheur',isOld()?'Cache · 14:18':'Observé à 14:32')+'</div><p>'+(isOld()?'Lecture seule. Aucune réponse ne peut être transmise depuis le cache.':'Le processus local et le calcul du modèle distant sont distincts. Les quotas du compte ne sont pas un budget réservé à cette tâche.')+'</p><p class="p-preview-note">Aperçu de la fiche. Aucune consigne ni opération n’est transmise dans cette étude.</p>');}
  function customize(){const s=selection[state.device];showModal('Personnaliser l’accueil','<p>Sélection pour '+(state.device==='android'?'Samsung S24 · Android':'Atelier · Windows')+'. Les autres appareils conservent leur propre sélection.</p><div class="p-theme-field"><label for="p-theme-select">Apparence</label><select class="p-theme-select" id="p-theme-select">'+[['system','Suivre l’application'],['light','Clair'],['dark','Sombre'],['matrix','Terminal / Matrix']].map(([value,label])=>'<option value="'+value+'" '+(state.theme===value?'selected':'')+'>'+label+'</option>').join('')+'</select></div><h3>Machines</h3>'+machines.map(m=>'<label><input type="checkbox" data-group="machines" value="'+m.id+'" '+(s.machines.includes(m.id)?'checked':'')+'>'+m.name+'</label>').join('')+'<h3>Workers</h3>'+workers.map(w=>'<label><input type="checkbox" data-group="workers" value="'+w.id+'" '+(s.workers.includes(w.id)?'checked':'')+'>'+w.name+'</label>').join('')+'<p class="p-preview-note">Retirer une carte conserve la supervision et les alertes. Les incidents critiques restent toujours visibles.</p>'+button('Appliquer à cet appareil','apply','check','p-primary'));}
  function search(){showModal('Rechercher','<input type="search" id="p-search-input" aria-label="Nom d’une machine ou d’un worker" placeholder="Machine, worker, projet…" autocomplete="off"><div id="p-search-results"></div>');root.querySelector('#p-search-input').addEventListener('input',searchResults);searchResults();root.querySelector('#p-search-input').focus();}
  function searchResults(){const q=root.querySelector('#p-search-input').value.toLocaleLowerCase('fr');const list=[...machines.map(m=>({id:m.id,name:m.name,type:'machine',label:'Machine'})),...workers.map(w=>({id:w.id,name:w.name,type:'worker',label:'Worker'})),{id:'sounding',name:'Sounding Lines',type:'project',label:'Projet'},{id:'arpent',name:'Arpent',type:'project',label:'Projet'}].filter(x=>x.name.toLocaleLowerCase('fr').includes(q));root.querySelector('#p-search-results').innerHTML=list.length?list.map(x=>'<button type="button" class="p-search-result" data-'+x.type+'="'+x.id+'"><span>'+x.name+'</span><small>'+x.label+'</small>'+icons('arrow-up-right')+'</button>').join(''):'<p style="padding-top:16px">Aucune ressource trouvée.</p>';refreshIcons();}
  root.addEventListener('click',e=>{const target=e.target.closest('button');if(!target)return;if(target.dataset.machine){openMachine(target.dataset.machine);return;}if(target.dataset.worker){openWorker(target.dataset.worker);return;}if(target.dataset.project){const sounding=target.dataset.project==='sounding';showModal(sounding?'Sounding Lines':'Arpent','<p>Production · VPS OVH</p><div class="p-detail-grid">'+detailItem('Release',sounding?'v0.8.4':'v1.2.1')+detailItem('Services',isOld()?'Ancien · 4 / 4 sains':sounding&&state.scenario==='incident'?'3 / 4 sains':'4 / 4 sains')+detailItem('Latence p95',sounding?'142 ms':'218 ms')+detailItem('Fraîcheur',isOld()?'Cache · 14:18':'Observé à 14:32')+'</div><p>'+ (isOld()?'Les métriques et l’état des services sont anciens.':sounding&&state.scenario==='incident'?'Le worker audio est bloqué. Le site reste accessible.':'Dernier contrôle réussi. Les services répondent aux tests de santé.')+'</p><p class="p-preview-note">Aperçu du contexte projet ; données fictives.</p>');return;}switch(target.dataset.action){case 'close':closeModal();break;case 'customize':customize();break;case 'apply':{state.theme=modal.querySelector('#p-theme-select').value;const s=selection[state.device];s.machines=[...modal.querySelectorAll('[data-group=machines]:checked')].map(x=>x.value);s.workers=[...modal.querySelectorAll('[data-group=workers]:checked')].map(x=>x.value);if(state.scenario==='empty')state.scenario='normal';closeModal();render();root.querySelector('[data-action=customize]').focus();break;}case 'search':search();break;case 'machines':showModal('Machines supervisées',machines.map(m=>'<button type="button" class="p-search-result" data-machine="'+m.id+'">'+icons(m.icon)+'<span>'+m.name+'</span><small>'+m.role+'</small></button>').join(''));break;case 'workers':showModal('Workers supervisés',workers.map(w=>'<button type="button" class="p-search-result" data-worker="'+w.id+'">'+icons(w.icon)+'<span>'+w.name+'</span><small>'+(isOld()?'Ancien':state.scenario==='incident'&&w.id==='audio'?'Bloqué':w.status)+'</small></button>').join(''));break;case 'incident':showModal('Traitement audio bloqué',badge('P1 · Production','danger','circle-alert')+'<h3>Faits observés</h3><p>Aucun progrès depuis 14:24. Quatre pistes en attente. Le processus est joignable et les autres services de Sounding Lines répondent.</p><h3>Corrélation à vérifier</h3><p>Un déploiement a eu lieu à 14:08. Le lien de causalité n’est pas établi.</p><h3>Intervention proposée</h3><p>Redémarrer uniquement le worker audio sur VPS OVH. Risque : retraitement de la piste en cours. Vérifier ensuite que la file avance et qu’aucun doublon n’est créé.</p><p class="p-preview-note">Étude du parcours : aucune action de production disponible ici.</p>');break;case 'rescue':showModal('Accès de secours au VPS',badge('Canal indépendant','warn','shield')+'<h3>VPS OVH · Production</h3><p>Une nouvelle authentification serait nécessaire sur le canal de secours préparé. Les données du centre restent en cache jusqu’à une observation indépendante.</p><div class="p-detail-grid">'+detailItem('Centre de contrôle','Injoignable')+detailItem('État actuel du VPS','Inconnu')+detailItem('Canal de secours','Non vérifié dans cette étude')+detailItem('Actions précédentes','Aucune remise en file')+'</div><p class="p-preview-note">Parcours proposé. Aucun accès réel au VPS n’est tenté.</p>');break;}});
  modal.addEventListener('click',e=>{if(e.target===modal)closeModal();});
  root.addEventListener('keydown',e=>{if((e.ctrlKey||e.metaKey)&&e.key.toLowerCase()==='k'){e.preventDefault();search();}if(e.key==='Escape'&&!modal.hidden){e.preventDefault();closeModal();}if(e.key==='Tab'&&!modal.hidden){const items=[...modal.querySelectorAll('button:not(:disabled),input:not(:disabled),select:not(:disabled),[tabindex="0"]')];if(e.shiftKey&&document.activeElement===items[0]){e.preventDefault();items[items.length-1].focus();}else if(!e.shiftKey&&document.activeElement===items[items.length-1]){e.preventDefault();items[0].focus();}}});
  render();
  if(globalThis.Tweak){const tweak=new Tweak({container:root,onChange:()=>{closeModal();render();}});tweak.addSelect(state,'device',{label:'Appareil',options:[{label:'Windows',value:'windows'},{label:'Android · Samsung S24',value:'android'}]});tweak.addSelect(state,'theme',{label:'Apparence',options:[{label:'Suivre l’application',value:'system'},{label:'Sombre',value:'dark'},{label:'Clair',value:'light'},{label:'Terminal / Matrix',value:'matrix'}]});tweak.addSelect(state,'scenario',{label:'État de l’accueil',options:[{label:'Normal activity',value:'normal'},{label:'Priority incident',value:'incident'},{label:'Control centre unavailable',value:'offline'},{label:'Partial telemetry',value:'partial'},{label:'No pinned resources',value:'empty'}]});tweak.addSelect(state,'density',{label:'Densité',options:[{label:'Comfortable',value:'comfortable'},{label:'Compact',value:'compact'}]});tweak.addSelect(state,'accent',{label:'Accent des thèmes classiques',options:[{label:'Cobalt',value:'cobalt'},{label:'Teal',value:'teal'}]});}
})();
